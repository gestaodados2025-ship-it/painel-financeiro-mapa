name: Robo Conciliador Tesouro

on:
  push:
    paths:
      - '.github/workflows/atualizar_dados.yml'
      - 'scripts/robo_conciliador.py'
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  conciliar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas requests

      - name: Executar Robo Conciliador
        run: python scripts/robo_conciliador.py

      - name: Salvar JSON atualizado
        run: |
          git config user.name "Robo Financeiro MAPA"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Atualizacao automatica EXE e RAP"
          git push
